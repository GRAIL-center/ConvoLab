# Production compose - run with: docker compose -f compose.prod.yml up -d
# Host Caddy proxies to the API container on port 3004
services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
      args:
        VITE_SITE_BANNER: ${VITE_SITE_BANNER:-}
    container_name: ai-dialogues-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3000"  # Only localhost, host Caddy proxies in
    environment:
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:?Set FIRESTORE_PROJECT_ID in .env.prod}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.prod}
      POST_SURVEY_URL: ${POST_SURVEY_URL:?Set POST_SURVEY_URL in .env.prod}
      SESSION_KEY: ${SESSION_KEY:?Set SESSION_KEY in .env.prod}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-${FIRESTORE_PROJECT_ID}}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    networks:
      - ai-dialogues

networks:
  ai-dialogues:
    driver: bridge
