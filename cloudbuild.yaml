# Cloud Build pipeline for the combined API + React Cloud Run service.
#
# Builds packages/api/Dockerfile.prod, pushes the image to Artifact Registry,
# then deploys it to Cloud Run. Configure substitution values in the Cloud
# Build trigger if your service/repo/region names differ from these defaults.

# Builds run as a dedicated deployer identity rather than the default compute
# service account. The default compute SA is what the production service itself
# runs as, so every role the build needs would also be held by the running app;
# a separate identity keeps build permissions out of the runtime.
# NB: a user-specified service account requires options.logging to be
# CLOUD_LOGGING_ONLY (set at the bottom of this file) — it cannot write to the
# default GCS log bucket.
serviceAccount: projects/convolab-490517/serviceAccounts/cloud-build-deployer@convolab-490517.iam.gserviceaccount.com

substitutions:
  # Image tag. Defaults to the commit for trigger-based builds; $COMMIT_SHA is
  # EMPTY for a manual `gcloud builds submit`, so pass it explicitly there:
  #   gcloud builds submit --substitutions=_TAG=$(git rev-parse HEAD)
  _TAG: $COMMIT_SHA
  _REGION: us-central1
  _SERVICE_NAME: convolab-api
  _REPOSITORY: cloud-run-source-deploy
  _IMAGE_NAME: convolab-api
  _GOOGLE_CLOUD_LOCATION: us-central1
  _VITE_SITE_BANNER: ''
  # reCAPTCHA for the public practice landing at `/` (practice.start).
  # _VITE_RECAPTCHA_SITE_KEY is the PUBLIC site key; Vite inlines it into the
  # static bundle at image-build time. _RECAPTCHA_SECRET_REF is the Secret
  # Manager reference for the server-side secret. Both default to empty, so the
  # pipeline keeps deploying before the PI has created the reCAPTCHA site and
  # secret; in that state `/` renders but Start fails closed in production
  # (/pilot and /study are unaffected). Once secret RECAPTCHA_SECRET_KEY exists:
  #   gcloud builds submit --project=convolab-490517 --config=cloudbuild.yaml \
  #     --substitutions=_TAG=$(git rev-parse HEAD),_VITE_RECAPTCHA_SITE_KEY=<site key>,_RECAPTCHA_SECRET_REF=RECAPTCHA_SECRET_KEY:latest
  # See docs/recaptcha-setup.md.
  _VITE_RECAPTCHA_SITE_KEY: ''
  _RECAPTCHA_SECRET_REF: ''

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - packages/api/Dockerfile.prod
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - --build-arg
      - VITE_SITE_BANNER=${_VITE_SITE_BANNER}
      - --build-arg
      - VITE_RECAPTCHA_SITE_KEY=${_VITE_RECAPTCHA_SITE_KEY}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

  # Runs through bash so the secret list can be extended conditionally: a
  # --set-secrets entry whose secret does not exist fails the deploy, and an
  # entry with an empty reference (RECAPTCHA_SECRET_KEY=) is rejected by gcloud
  # ("No secret version specified"), so RECAPTCHA_SECRET_KEY is appended only
  # when _RECAPTCHA_SECRET_REF is non-empty. ($$ escapes a shell variable from
  # Cloud Build substitution.)
  # No --allow-unauthenticated: that flag sets the service's IAM policy,
  # which roles/run.developer deliberately cannot do. The service already
  # has allUsers -> roles/run.invoker, and that binding survives redeploys
  # untouched (verified 13 Aug 2026), so the flag was a no-op anyway.
  # NB: if this service is ever deleted and recreated from scratch it will
  # come up private, and the binding has to be restored by hand.
  # GIT_SHA is the image tag (the commit), stamped as `seedVersion` on the
  # scenario and quota preset documents the API reconciles at startup.
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SECRETS="SESSION_KEY=SESSION_KEY:latest,FRONTEND_URL=FRONTEND_URL:latest,ADMIN_EMAILS=ADMIN_EMAILS:latest,GOOGLE_CALLBACK_URL=GOOGLE_CALLBACK_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GOOGLE_AI_API_KEY=GOOGLE_AI_API_KEY:latest,POST_SURVEY_URL=POST_SURVEY_URL:latest"
        if [ -n "${_RECAPTCHA_SECRET_REF}" ]; then
          SECRETS="$${SECRETS},RECAPTCHA_SECRET_KEY=${_RECAPTCHA_SECRET_REF}"
        fi
        gcloud run deploy "${_SERVICE_NAME}" \
          --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}" \
          --region "${_REGION}" \
          --platform managed \
          --set-env-vars "NODE_ENV=production,HOST=0.0.0.0,FIRESTORE_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION},GIT_SHA=${_TAG}" \
          --set-secrets "$${SECRETS}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
