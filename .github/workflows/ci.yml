name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -F @workspace/database generate

      - name: Build database package
        run: pnpm -F @workspace/database build

      - name: Lint
        run: pnpm lint

      - name: Typecheck API
        run: pnpm -F @workspace/api type-check

      - name: Typecheck App
        run: pnpm -F @workspace/app type-check

      - name: Build
        run: pnpm build

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -F @workspace/database generate

      - name: Build database package
        run: pnpm -F @workspace/database build

      - name: Run database shim tests
        run: pnpm -F @workspace/database test

      - name: Run safe API tests
        run: pnpm -F @workspace/api exec vitest run --config vitest.safe.config.ts

      - name: Run Firestore atomicity tests
        run: pnpm -F @workspace/api exec vitest run --config vitest.atomic.config.ts
